harvest:
  openapiDirectory: openapi/
  specs:
  - file: openapi/green-button-alliance-green-button-api-openapi.yml
    sourceURL: https://raw.githubusercontent.com/GreenButtonAlliance/OpenAPI-Green-Button-Documentation/main/green-button-openapi.yaml
    repository: https://github.com/GreenButtonAlliance/OpenAPI-Green-Button-Documentation
    fetchDate: '2026-07-27'
    httpStatus: 200
    bytes: 20333
    openapiVersion: 3.0.0
    title: Green Button API Documentation
    infoDescription: Green Button API - ESPI 4.0
    license: Apache 2.0
    parses: true
    pathCount: 7
    paths:
    - GET /espi/1_1/resource/ApplicationInformation
    - GET /espi/1_1/resource/ApplicationInformation/{applicationInformationId}
    - GET /espi/1_1/resource/Authorization
    - GET /espi/1_1/resource/Authorization/{authorizationId}
    - GET /espi/1_1/resource/Batch/Bulk/{bulkId}
    - GET /espi/1_1/resource/UsagePoint
    - GET /espi/1_1/resource/UsagePoint/{usagePointId}
    servers:
    - https://sandbox.greenbuttonalliance.org:8443/DataCustodian
    securitySchemes: [oauth2 (authorizationCode, clientCredentials)]
    note: >-
      A JSON twin (green-button-openapi.json, HTTP 200, 20894 bytes) exists in
      the same repository and parses identically; only the YAML is stored to
      avoid duplication.
  - file: openapi/green-button-alliance-application-information-openapi.yml
    sourceURL: https://raw.githubusercontent.com/GreenButtonAlliance/SwaggerHub-GreenButton-API-Documentation/main/OAS_APIs/ApplicationInformation.yaml
    repository: https://github.com/GreenButtonAlliance/SwaggerHub-GreenButton-API-Documentation
    fetchDate: '2026-07-27'
    httpStatus: 200
    bytes: 12660
    openapiVersion: 3.0.3
    title: Green Button Resource Server ApplicationInformation API Documentation
    license: Apache 2.0
    parses: true
    pathCount: 1
    paths:
    - /espi/1_1/resource/ApplicationInformation
    servers:
    - https://virtserver.swaggerhub.com/GreenButtonAlliance/Green_Button_Resource_Server
      (SwaggerHub auto-mock)
    - https://sandbox.greenbuttonalliance.org:8443/DataCustodian (production sandbox)
    - https://sandboxdev.greenbuttonalliance.org:8443/DataCustodian (development sandbox)
  notHarvested:
  - what: Swagger 1.2 resource listings (legacy)
    where: >-
      https://greenbuttonalliance.github.io/OpenESPI-GreenButton-API-Documentation/API/api-docs
      plus 11 listings under API/listings/ (ApplicationInformation, Authorization,
      Batch, ElectricPowerQualitySummary, IntervalBlock, LocalTimeParameters,
      MeterReading, ReadingType, ServiceStatus, UsagePoint, UsageSummary) and 4
      under ThirdParty/listings/.
    httpStatus: 200
    reason: >-
      Real and reachable, but Swagger 1.2 — superseded by the OpenAPI 3.0.0
      document above and not valid OpenAPI. Recorded here rather than converted,
      because converting would fabricate a contract GBA has not published. Worth
      noting the legacy listings cover 11 ESPI resources versus the 7 paths in
      the current OpenAPI, so the modern definition is the narrower artifact.
  - what: NAESB REQ.21 ESPI v4.0 / v3.3 normative standard
    reason: Paywalled — sold by NAESB. Not fetched, not reproduced.
  - what: Certified-implementation registry
    reason: No machine-readable form exists; Directory Services is HTML-only and
      forbids automated retrieval.

