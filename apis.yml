- aid: green-button-alliance:green-button-third-party-api
  name: Green Button Third Party (OpenESPI) API
  description: >-
    The Third Party side of the OpenESPI reference implementation — ApplicationInformation, Authorization
    and RetailCustomer operations documented as legacy Swagger 1.2 resource listings served from GBA's
    GitHub Pages site. The documented base path is https://services.greenbuttondata.org/ThirdParty, which
    returned HTTP 200 with an empty body on 2026-07-27. No OpenAPI 3.x definition of this surface was
    found and no live, callable service was confirmed; listed here because the documentation is genuinely
    published and reachable.
  humanURL: https://greenbuttonalliance.github.io/OpenESPI-GreenButton-API-Documentation/ThirdParty/
  baseURL: https://services.greenbuttondata.org/ThirdParty
  tags:
