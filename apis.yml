aid: green-button-alliance
url: https://raw.githubusercontent.com/api-evangelist/green-button-alliance/refs/heads/main/apis.yml
name: Green Button Alliance
kind: company
description: >-
  The Green Button Alliance (GBA) is the non-profit that stewards, tests and
  certifies the Green Button standard — the NAESB REQ.21 Energy Services
  Provider Interface (ESPI) profile for utility customer electricity, natural
  gas and water usage data, in its Download My Data (DMD) and Connect My Data
  (CMD) forms. Incorporated in North Carolina and headquartered at PO Box 268,
  Jamison, Pennsylvania, it was formed after the 2012 White House / U.S.
  Department of Energy / NIST call to action and is the industry's only source
  of Green Button certification (Data Custodian DMD $3,000, CMD $3,200,
  membership not required), alongside a free public Directory Services listing
  of utilities, third-party apps and platform providers. GBA sits in the
  standards-and-certification layer of the United States energy value chain,
  above the investor-owned utilities and the energy-data platforms (UtilityAPI,
  Con Edison and Enbridge Gas are sponsor members) that actually move consumer
  data. Its API posture is contracts without a service: three real OpenAPI 3.x
  definitions - the CMD ESPI resource server, the ApplicationInformation
  registration resource, and the OpenESPI OAuth 2.0 / OIDC authorization server -
  are published free under Apache 2.0 on GitHub, but the normative ESPI v4.0
  standard itself must be purchased
  from NAESB, GBA operates no production consumer-data or market-data API of
  its own, and its ESPI sandbox at sandbox.greenbuttonalliance.org:8443 is
  offline pending a replacement platform expected 2026Q3. Green Button in the
  United States is voluntary — there is no federal mandate — with obligation
  arriving only through state action and, outside the US, Ontario's O. Reg.
  633/21.
