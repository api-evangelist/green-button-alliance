apis:
- aid: green-button-alliance:green-button-connect-my-data-api
  name: Green Button Connect My Data (CMD) ESPI Resource Server API
  description: >-
    The Green Button Connect My Data resource server API as specified by the Green Button Alliance against
    NAESB REQ.21 ESPI 4.0 — read access to ApplicationInformation, Authorization, UsagePoint and bulk
    Batch resources under /espi/1_1/resource, returned as ESPI/Atom XML and protected by OAuth 2.0 (authorization
    code and client credentials). GBA publishes the contract openly under Apache 2.0 on GitHub; the only
    base URL documented in it is GBA's own ESPI sandbox, which returned HTTP 403 to anonymous probes on
    2026-07-27 and which GBA states is unavailable pending a new platform in 2026Q3. This is a specification
    of the interface every certified Data Custodian implements, not a live service run by GBA.
  humanURL: https://greenbuttonalliance.github.io/OpenESPI-GreenButton-API-Documentation/API/
  baseURL: https://sandbox.greenbuttonalliance.org:8443/DataCustodian
  tags:
  - Green Button
  - Connect My Data
  - ESPI
  - Energy
  - Usage Data
  - OAuth 2.0
