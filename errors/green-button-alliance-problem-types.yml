gaps:
- >-
  The CMD ESPI resource server contract - the one every certified Data Custodian
  implements - declares no error body schema at all. An agent calling a certified
  utility has only the HTTP status to work with.
- >-
  No error code registry is published. There is no named catalogue of ESPI error
  conditions on greenbuttonalliance.org; the normative error rules live in the
  paywalled NAESB REQ.21 standard.
- No responses use application/problem+json (RFC 9457).
