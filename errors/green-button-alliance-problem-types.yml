description: >-
  Derived from every 4xx/5xx response declared across the three published Green
  Button OpenAPI documents. Two very different error postures sit side by side. The
  CMD ESPI resource server contract declares status codes with a description and NO
  response schema at all - there is no machine-readable error body in the published
  contract, which is a real gap worth raising with GBA. The OpenESPI Authorization
  Server declares a reusable, well-shaped OAuth 2.0 style JSON error object on every
  failure path. Nothing here is invented: no title, remediation or type URI has been
  authored beyond what the specs say.
