name: Green Button / NAESB REQ.21 ESPI Function Blocks
description: >-
  The controlled vocabulary the Green Button Alliance publishes for NAESB REQ.21
  ESPI Function Blocks. GBA's own words: "The NAESB REQ.21 ESPI standard uses
  Function Blocks to define the type of data a Utility can provide a Third Party
  service provider and the type of data a Third Party service provider requests
  from the Utility during the OAuth 2.0 access-token request process. The list of
  available Function Blocks a Utility supports is shown in the <scope> (from ESPI)
  element field of the <ApplicationInformation> resource - and the resource may
  contain multiple <scope> entries." Function Blocks are therefore both the
  certification test grouping AND the OAuth scope vocabulary of Green Button
  Connect My Data (see scopes/green-button-alliance-scopes.yml).
  Names, ids and mandatory markers below are transcribed verbatim from the two
  GBA pages above (both HTTP 200, 2026-07-27). No Function Block has been invented
  and none has been renamed.
certification_categories:
- Certification
- Cyber Security
- Data Element
- Data Format
- File Name Format
- Fundamental
- Privacy
- Protocol
- User Interface
- Usage Data
- Retail Customer
mandatory_key:
  MANDATORY: Required for both CMD and DMD certification.
  CMD-MANDATORY: Required only for Connect My Data certification.
  DMD-MANDATORY: Required only for Download My Data certification.
  unmarked: Optional for certification.
interval_data_rule: >-
  GBA note - "[FB_04] requires that at least one type of Interval Data from the
  following list MUST be certified in addition to [FB_04] for both CMD and DMD
  certification": FB_05, FB_10, FB_11, FB_29.
